openapi: 3.0.3
info:
  title: Event Booking REST API
  description: API for user accounts, event management, and event registrations.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Users
    description: User registration and authentication
  - name: Events
    description: Event management
  - name: Registrations
    description: Event registration management

paths:
  /signup:
    post:
      tags: [Users]
      summary: Create a user account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentials"
            example:
              email: user@example.com
              password: secure-password
      responses:
        "201":
          description: User account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: User signed up successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /login:
    post:
      tags: [Users]
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentials"
            example:
              email: user@example.com
              password: secure-password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid user credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /events:
    get:
      tags: [Events]
      summary: List all events
      operationId: getEvents
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Events]
      summary: Create an event
      description: The authenticated user becomes the owner of the new event.
      operationId: createEvent
      security:
        - AuthorizationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            example:
              title: Go Meetup
              description: A Go community meetup
              location: Online
              date_time: "2026-10-14T18:00:00Z"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      summary: Get an event
      operationId: getEvent
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Events]
      summary: Update an event
      description: Only the event owner can update it.
      operationId: updateEvent
      security:
        - AuthorizationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated user does not own this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Events]
      summary: Delete an event
      description: Only the event owner can delete it.
      operationId: deleteEvent
      security:
        - AuthorizationToken: []
      responses:
        "200":
          description: Deleted event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated user does not own this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /events/{id}/registration:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Registrations]
      summary: Register for an event
      description: The current implementation permits registration only when the authenticated user owns the event.
      operationId: registerForEvent
      security:
        - AuthorizationToken: []
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Successfully registered for event
        "400":
          description: Invalid event ID or user is not authorized to register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Registrations]
      summary: Cancel an event registration
      description: The current implementation permits cancellation only when the authenticated user owns the event.
      operationId: unregisterFromEvent
      security:
        - AuthorizationToken: []
      responses:
        "200":
          description: Registration cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Successfully unregistered from event
        "400":
          description: Invalid event ID or user is not authorized to cancel the registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    AuthorizationToken:
      type: apiKey
      in: header
      name: Authorization
      description: "JWT token sent directly in the header; do not prepend the Bearer scheme."
  parameters:
    EventID:
      name: id
      in: path
      required: true
      description: Numeric event ID
      schema:
        type: integer
        format: int64
  schemas:
    UserCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secure-password
    EventInput:
      type: object
      required: [title, description, location, date_time]
      properties:
        title:
          type: string
          example: Go Meetup
        description:
          type: string
          example: A Go community meetup
        location:
          type: string
          example: Online
        date_time:
          type: string
          format: date-time
          example: "2026-10-14T18:00:00Z"
    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          required: [id, user_id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
            user_id:
              type: integer
              format: int64
              example: 42
    LoginResponse:
      type: object
      required: [message, token]
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          description: Signed JWT valid for two hours
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request data or event ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Not authorized
    InternalServerError:
      description: An internal error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
